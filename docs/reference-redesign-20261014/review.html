<!doctype html><html lang="es"><meta charset="utf-8"><title>Personajes · revisión de animaciones</title><style>
*{box-sizing:border-box}body{background:#111720;color:#f3eddb;font:16px system-ui;margin:0;padding:28px}header{display:flex;gap:24px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#111720ee;padding:16px 0;z-index:2}h1{font-size:22px;margin:0}p{color:#acb5c6;font-size:14px;margin:6px 0}label{display:flex;gap:8px;align-items:center}select,button{background:#283244;color:white;border:1px solid #546277;border-radius:6px;padding:8px}main{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:18px}article{background:#1c2533;border:1px solid #334157;border-radius:10px;overflow:hidden}h2{font-size:16px;margin:12px 16px 0}canvas{display:block;width:100%;image-rendering:pixelated}small{display:block;padding:0 16px 12px;color:#9faec2}
</style><header><div><h1>Revisión de personajes</h1><p>Referencias nuevas · vista de poses y direcciones</p></div><label>Acción<select id="action"><option value="idle">Reposo</option><option value="move">Desplazamiento</option><option value="attack">Ataque</option><option value="special">Habilidad</option><option value="death">Derrota</option></select></label><label>Dirección<select id="dir"><option value="4">Frente</option><option value="3">Frente derecha</option><option value="2">Derecha</option><option value="1">Espalda derecha</option><option value="0">Espalda</option><option value="7">Espalda izquierda</option><option value="6">Izquierda</option><option value="5">Frente izquierda</option></select></label><button id="pause">Pausar</button></header><main id="grid"></main><script src="preview-data.js"></script><script>
const query=new URLSearchParams(location.search);action.value=query.get('action')||'idle';dir.value=query.get('direction')||'4';
let paused=false,hold=0,last=0;pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Reproducir':'Pausar'};
const cards=characterData.map(c=>{const el=document.createElement('article');el.innerHTML='<h2>'+c.id+'</h2><canvas width="360" height="300"></canvas><small>'+(c.flying?'Vuelo':'Salto alternado')+' · '+(c.columns*c.rowCount)+' poses</small>';grid.append(el);const im=new Image();im.src='art/'+c.id+'-combat.png';return {c,im,canvas:el.querySelector('canvas')}});
function draw(t){if(!paused)hold+=Math.min(50,t-last);last=t;for(const {c,im,canvas} of cards){if(!im.complete)continue;const g=canvas.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,360,300);g.fillStyle='#1c2533';g.fillRect(0,0,360,300);g.strokeStyle='#344253';g.beginPath();g.moveTo(20,269);g.lineTo(340,269);g.stroke();const d=+dir.value,row=c.rows[d],flip=c.mirror.includes(d);let seq=action.value==='move'?[2,3,4,5]:action.value==='attack'?[6,7,0]:action.value==='special'?c.special:action.value==='death'?c.death:[0,1];const k=Math.floor(hold/230)%seq.length,p=c.frames[row][seq[k]],base=c.frames[c.rows[4]][0];const scale=Math.min(2.1,230/base.height,300/base.width);let lift=action.value==='move'&&!c.flying?Math.sin((hold%920)/920*Math.PI)*22:0;if(c.flying)lift=13+Math.sin(hold/300)*3;g.save();g.translate(180,269-lift);if(flip)g.scale(-1,1);g.drawImage(im,...p.rect,-p.anchor[0]*scale,-p.anchor[1]*scale,p.rect[2]*scale,p.rect[3]*scale);g.restore();}requestAnimationFrame(draw)}requestAnimationFrame(draw);
window.reviewReady=()=>cards.every(c=>c.im.complete);
</script></html>
