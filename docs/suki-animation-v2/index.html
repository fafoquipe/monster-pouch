<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suki · animaciones</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111720;color:#eee5da}*{box-sizing:border-box}body{max-width:1120px;margin:0 auto;padding:28px}header{display:flex;gap:24px;align-items:center;justify-content:space-between}h1{margin:0;font-size:28px}p{color:#b7adab;line-height:1.5}button{background:#5b3349;color:#fff3df;border:1px solid #95647c;border-radius:6px;padding:10px 20px;cursor:pointer;font:inherit}main{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0}article{border:1px solid #3e3744;background:#181f2b;border-radius:10px;overflow:hidden}canvas{width:100%;display:block;image-rendering:pixelated}h2{font-size:16px;margin:14px 16px 6px}article p{font-size:13px;margin:0 16px 18px}footer{font-size:12px;color:#9a969b}@media(max-width:760px){main{grid-template-columns:repeat(2,1fr)}body{padding:16px}}@media(max-width:440px){main{grid-template-columns:1fr}}
</style>
<header><div><h1>Suki</h1><p>Animaciones del personaje, capturadas desde Unity.</p></div><button id="toggle">Pausar</button></header>
<main></main><footer>Revisión 2 · El visor reproduce dibujos renderizados por el juego. Los pescados y los efectos de escudo se muestran durante el combate.</footer>
<script>
const clips=[['Reposo','Proporciones y silueta.',1.2],['Saltos','Dos casillas con pies alternos.',1.5],['Puñetazo','Preparación, impacto y recuperación.',1],['Lanzamiento','Pescado en mano y gesto de soltarlo.',1],['Derrota','Caída y pose encogida.',.85],['Lanzamiento a la izquierda','Orientación y movimiento hacia el aliado.',1]];
const main=document.querySelector('main');
const views=clips.map(([name,description,duration])=>{const card=document.createElement('article');card.innerHTML='<canvas width="192" height="192"></canvas><h2>'+name+'</h2><p>'+description+'</p>';main.append(card);const ctx=card.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;return {ctx,duration};});
const atlas=new Image();atlas.src='runtime-animation.png';let elapsed=0,last=0,playing=true;
document.getElementById('toggle').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'Pausar':'Reproducir';};
function draw(now){if(playing&&last)elapsed+=(now-last)/1000;last=now;if(atlas.complete&&atlas.naturalWidth)views.forEach(({ctx,duration},row)=>{const t=Math.min(duration,elapsed%(duration+.45));const frame=Math.min(31,Math.floor(t/duration*31));ctx.drawImage(atlas,frame*192,row*192,192,192,0,0,192,192);});requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
